[project]
name = "pcbforge"
version = "0.1.0"
description = "Code-first PCB pipeline: SKiDL -> KiCad -> Freerouting -> DRC -> Gerbers, with a Claude agent on top"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "skidl>=3.0",
    "gerbonara>=1.5",  # 1.6+ needs Python 3.12; KiCad 9 on Windows bundles 3.11
    "anthropic>=1.15",
]
# KiCad's `pcbnew` module ships with KiCad itself, not on PyPI. Create your
# virtualenv with --system-site-packages (see scripts/setup_ubuntu.sh).

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pcbforge = "pcbforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pcbforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning", "ignore::UserWarning"]
